services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: observability-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: host.docker.internal
      RABBITMQ_HOST: observability-rabbitmq
    networks:
      - default
      - rabbitmq_bridge
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001
    container_name: observability-frontend
    ports:
      - "5177:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  rabbitmq_bridge:
    external: true
    name: bridge
